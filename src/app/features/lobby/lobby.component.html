<div class="lobby-container">
  <h1>{{ 'lobby.title' | translate }}</h1>

  <div class="lobby-card">
    <div class="form-group">
      <label for="playerName">{{ 'lobby.playerName' | translate }}</label>
      <input id="playerName" type="text" [(ngModel)]="playerName"
        [placeholder]="'lobby.playerNamePlaceholder' | translate" [disabled]="loading()" />
    </div>

    @if (error()) {
    <div class="error-message">{{ error() }}</div>
    }

    <div class="actions">
      <button class="btn btn-primary" (click)="createGame()" [disabled]="loading() || !playerName()">
        @if (loading()) {
        <span>{{ 'lobby.creating' | translate }}</span>
        } @else {
        <span>{{ 'lobby.createGame' | translate }}</span>
        }
      </button>
    </div>

    <div class="divider">
      <span>{{ 'lobby.or' | translate }}</span>
    </div>

    <div class="form-group">
      <label for="gameId">{{ 'lobby.gameIdLabel' | translate }}</label>
      <input id="gameId" type="text" [(ngModel)]="gameIdToJoin" [placeholder]="'lobby.gameIdPlaceholder' | translate"
        [disabled]="loading()" />
    </div>

    <div class="actions">
      <button class="btn btn-secondary" (click)="joinGame()" [disabled]="loading() || !playerName() || !gameIdToJoin()">
        @if (loading()) {
        <span>{{ 'lobby.joining' | translate }}</span>
        } @else {
        <span>{{ 'lobby.joinGame' | translate }}</span>
        }
      </button>
    </div>

    @if (createdGameId()) {
    <div class="game-id-info">
      <p>{{ 'lobby.yourGameId' | translate }}</p>
      <div class="game-id-box">
        <code>{{ createdGameId() }}</code>
        <button class="btn-copy-icon" (click)="copyGameId()" [title]="'lobby.copyId' | translate">
          📋
        </button>
      </div>
    </div>
    }
  </div>
</div>
